name: Build rocm server image

on:
  workflow_run:
    workflows: ["Sync upstream and build server image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if an image for the current upstream commit already exists
        type: boolean
        default: false

concurrency:
  group: rocm-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  rocm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve upstream commit
        id: up
        run: |
          git remote add upstream https://github.com/spiritbuun/buun-llama-cpp.git 2>/dev/null || true
          git fetch --no-tags upstream master
          UP=$(git rev-parse --short=12 upstream/master)
          echo "up=$UP" >> "$GITHUB_OUTPUT"
          echo "upstream head: $UP"

      - name: Work around upstream HIP break (lightning_deferred_k)
        run: |
          # upstream d2407c33 declares ggml_backend_cuda_context::lightning_deferred_k
          # inside "#if !defined(GGML_USE_HIP)" in ggml-cuda/common.cuh, but
          # ggml-cuda.cu uses it unguarded -> the HIP build of ggml-hip fails with
          # "no member named 'lightning_deferred_k'". The lightning indexer itself
          # has a real ROCm path (lightning_indexer_kernel_vec), so declare the
          # member for HIP as well instead of disabling the optimisation.
          # No-op once upstream fixes this (and if it ever flips to declaring it
          # under HIP upstream, drop this step).
          f=ggml/src/ggml-cuda/common.cuh
          if grep -q 'lightning_deferred_k' "$f" && ! grep -q 'GGML_HIP_LIGHTNING_DEFERRED_K' "$f"; then
            ln=$(grep -n 'lightning_deferred_k' "$f" | head -1 | cut -d: -f1)
            end=$(awk -v n="$ln" 'NR>n && /^#endif/{print NR; exit}' "$f")
            printf '%s\n' \
              '#if defined(GGML_USE_HIP)' \
              '    std::unordered_set<const void *> lightning_deferred_k; // GGML_HIP_LIGHTNING_DEFERRED_K' \
              '#endif' > /tmp/hip-deferred-k.ins
            sed -i "${end}r /tmp/hip-deferred-k.ins" "$f"
            echo "patched common.cuh (line $end): declared lightning_deferred_k for HIP"
            sed -n "$((ln-2)),$((end+4))p" "$f"
          else
            echo "no patch needed for common.cuh"
          fi

      - name: Fix build context (.dockerignore)
        run: |
          if grep -qxF 'models/*' .dockerignore 2>/dev/null; then
            grep -vxF 'models/*' .dockerignore > .dockerignore.tmp
            mv .dockerignore.tmp .dockerignore
            echo "removed 'models/*' exclusion - chat templates must reach the build context"
          else
            echo "no 'models/*' exclusion present"
          fi
          cat .dockerignore

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/share/miniconda
          df -h / | tail -1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: check
        run: |
          HEAD12=$(git rev-parse --short=12 HEAD)
          echo "head=$HEAD12" >> "$GITHUB_OUTPUT"
          # Stamp = build config (Dockerfile + this workflow) + upstream commit.
          CFG=$(cat .devops/rocm.Dockerfile .github/workflows/rocm-build.yml | sha1sum | cut -c1-8)
          echo "cfg=$CFG" >> "$GITHUB_OUTPUT"
          exists=false
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:rocm-${CFG}-${{ steps.up.outputs.up }}" >/dev/null 2>&1; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "stamp rocm-${CFG}-${{ steps.up.outputs.up }} already built: $exists"

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/setup-buildx-action@v4

      - name: Build and push rocm server image
        id: build
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/rocm.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            ROCM_VERSION=7.2.1
            AMDGPU_VERSION=7.2.1
            ROCM_DOCKER_ARCH=gfx1100;gfx1150;gfx1151
            IMAGE_SOURCE=https://github.com/loukaniko85/buun-llama-cpp
            IMAGE_URL=https://github.com/loukaniko85/buun-llama-cpp
          tags: |
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-rocm
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:rocm-${{ steps.check.outputs.cfg }}-${{ steps.up.outputs.up }}
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:head-${{ steps.check.outputs.head }}-rocm
          cache-from: type=gha,scope=rocm
          cache-to: type=gha,mode=max,scope=rocm

      - name: Summary
        if: steps.build.outputs.digest != ''
        run: |
          {
            echo "### buun-llama-cpp rocm (gfx1100;gfx1150;gfx1151) image built"
            echo ""
            echo "- pull: \`docker pull ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-rocm\`"
            echo "- upstream: \`${{ steps.up.outputs.up }}\` / fork head: \`${{ steps.check.outputs.head }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
