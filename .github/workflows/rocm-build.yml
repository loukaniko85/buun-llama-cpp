name: Build rocm server image

on:
  workflow_run:
    workflows: ["Sync upstream and build server image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if an image for the current upstream commit already exists
        type: boolean
        default: false

concurrency:
  group: rocm-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  rocm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve upstream commit
        id: up
        run: |
          git remote add upstream https://github.com/spiritbuun/buun-llama-cpp.git 2>/dev/null || true
          git fetch --no-tags upstream master
          UP=$(git rev-parse --short=12 upstream/master)
          echo "up=$UP" >> "$GITHUB_OUTPUT"
          echo "upstream head: $UP"

      - name: Work around upstream HIP break (lightning_deferred_k)
        run: |
          # Patch ONLY the genuinely broken upstream form where the member is
          # hidden from HIP by "#if !defined(GGML_USE_HIP)". Upstream now declares
          # it unconditionally -- matching on the bare name there would inject a
          # duplicate member and BREAK the HIP build (that is what failed on
          # e07675d6e). This is a no-op while upstream stays fixed, and re-arms
          # itself if the guard ever returns.
          f=ggml/src/ggml-cuda/common.cuh
          decl='std::unordered_set<const void \*> lightning_deferred_k'
          if grep -q 'GGML_HIP_LIGHTNING_DEFERRED_K' "$f"; then
            echo "HIP workaround already present"
          elif grep -B3 "$decl" "$f" | grep -q '#if !defined(GGML_USE_HIP)'; then
            ln=$(grep -n "$decl" "$f" | head -1 | cut -d: -f1)
            end=$(awk -v n="$ln" 'NR>n && /^#endif/{print NR; exit}' "$f")
            printf '%s\n' \
              '#if defined(GGML_USE_HIP)' \
              '    std::unordered_set<const void *> lightning_deferred_k; // GGML_HIP_LIGHTNING_DEFERRED_K' \
              '#endif' > /tmp/hip-deferred-k.ins
            sed -i "${end}r /tmp/hip-deferred-k.ins" "$f"
            echo "patched common.cuh (line $end): declared lightning_deferred_k for HIP"
            sed -n "$((ln-2)),$((end+4))p" "$f"
          else
            echo "no HIP workaround needed: upstream declares lightning_deferred_k unconditionally"
          fi

      - name: Work around upstream HIP break (__ldcg)
        run: |
          # ROCm's hip headers only overload __ldcg for __half/__half2. Upstream kernels
          # call it on float / unsigned int / float4, so the HIP build fails with
          # "no matching function for call to '__ldcg'". Route generic loads through a
          # portable helper in common.cuh. Patched in the build context only, so future
          # upstream merges stay conflict-free and new __ldcg call sites are covered.
          f=ggml/src/ggml-cuda/common.cuh
          if ! grep -q 'GGML_HIP_LDCG_HELPER' "$f"; then
            cat > /tmp/ldcg.helper <<'HELPER'
          // GGML_HIP_LDCG_HELPER - ROCm only overloads __ldcg for __half/__half2.
          template<typename T>
          static __device__ __forceinline__ T ggml_hip_ldcg(const T * ptr) {
          #if defined(GGML_USE_HIP)
              return *ptr;
          #else
              return __ldcg(ptr);
          #endif
          }
          HELPER
            awk '/#define STRINGIZE_IMPL/{while ((getline line < "/tmp/ldcg.helper") > 0) print line} {print}' "$f" > /tmp/common.new
            mv /tmp/common.new "$f"
            echo "inserted ggml_hip_ldcg helper into common.cuh"
          else
            echo "ggml_hip_ldcg helper already present"
          fi
          for g in $(grep -rl '__ldcg(' ggml/src/ggml-cuda --include='*.cu' --include='*.cuh' | grep -v 'common.cuh'); do
            sed -i 's/__ldcg(/ggml_hip_ldcg(/g' "$g"
            echo "patched $g"
          done

      - name: Expose HIP-guarded context members
        run: |
          # Upstream hides a block of ggml_backend_cuda_context members behind
          # "#if !defined(GGML_USE_HIP)", but HIP-compiled kernels (gated_delta_net,
          # lightning-indexer, ...) use them unguarded -> "no member named ...".
          # Declare HIP-compatible copies just after that guarded block.
          f=ggml/src/ggml-cuda/common.cuh
          if ! grep -q 'GGML_HIP_CONTEXT_MEMBERS' "$f"; then
            awk '
              /consume_int8_channel_activation/ { in_func=1 }
              in_func && /^#endif/ {
                print
                print "#if defined(GGML_USE_HIP)"
                print "    // GGML_HIP_CONTEXT_MEMBERS - upstream guards these from HIP but the kernels use them."
                print "    struct gdn_state_read_entry {"
                print "        const ggml_tensor * gdn        = nullptr;"
                print "        const float *       base       = nullptr;"
                print "        const int32_t *     rows       = nullptr;"
                print "        int64_t             row_stride = 0;"
                print "        bool                used       = false;"
                print "    };"
                print "    std::vector<gdn_state_read_entry> gdn_state_reads;"
                print "    int64_t gdn_state_read_count = 0;"
                print "    std::unordered_set<const void *> lightning_deferred_k;"
                print "#endif"
                in_func=0
                next
              }
              {print}
            ' "$f" > /tmp/common.new
            mv /tmp/common.new "$f"
            echo "exposed gdn_state_reads / gdn_state_read_count / lightning_deferred_k for HIP"
          else
            echo "HIP context members already present"
          fi

      - name: Alias remaining CUDA enums/APIs for HIP
        run: |
          # Upstream moe-cache.cu uses CUDA-only names (cudaMemoryTypeHost,
          # cudaStreamCaptureModeThreadLocal) and the 3-arg cudaGraphInstantiate.
          # Extend the fork's HIP compatibility header in the build context only.
          h=ggml/src/ggml-cuda/vendors/hip.h
          if ! grep -q 'GGML_HIP_API_ALIASES' "$h"; then
            sed -i 's/^#define cudaGraphInstantiate hipGraphInstantiate$/#define cudaGraphInstantiate(exec, graph, ...) hipGraphInstantiate(exec, graph, nullptr, nullptr, 0)/' "$h"
            printf '\n// GGML_HIP_API_ALIASES - CUDA names used by upstream kernels but absent in hip.h\n#define cudaMemoryTypeHost hipMemoryTypeHost\n#define cudaStreamCaptureModeThreadLocal hipStreamCaptureModeThreadLocal\n' >> "$h"
            echo "added HIP aliases to vendors/hip.h"
          else
            echo "HIP aliases already present"
          fi

      - name: Fix build context (.dockerignore)
        run: |
          if grep -qxF 'models/*' .dockerignore 2>/dev/null; then
            grep -vxF 'models/*' .dockerignore > .dockerignore.tmp
            mv .dockerignore.tmp .dockerignore
            echo "removed 'models/*' exclusion - chat templates must reach the build context"
          else
            echo "no 'models/*' exclusion present"
          fi
          cat .dockerignore

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/share/miniconda
          df -h / | tail -1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: check
        run: |
          HEAD12=$(git rev-parse --short=12 HEAD)
          echo "head=$HEAD12" >> "$GITHUB_OUTPUT"
          # Stamp = build config (Dockerfile + this workflow) + upstream commit.
          CFG=$(cat .devops/rocm.Dockerfile .github/workflows/rocm-build.yml | sha1sum | cut -c1-8)
          echo "cfg=$CFG" >> "$GITHUB_OUTPUT"
          exists=false
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:rocm-${CFG}-${{ steps.up.outputs.up }}" >/dev/null 2>&1; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "stamp rocm-${CFG}-${{ steps.up.outputs.up }} already built: $exists"

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/setup-buildx-action@v4

      - name: Build and push rocm server image
        id: build
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/rocm.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            ROCM_VERSION=7.2.1
            AMDGPU_VERSION=7.2.1
            ROCM_DOCKER_ARCH=gfx1100;gfx1150;gfx1151
            IMAGE_SOURCE=https://github.com/loukaniko85/buun-llama-cpp
            IMAGE_URL=https://github.com/loukaniko85/buun-llama-cpp
          tags: |
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-rocm
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:rocm-${{ steps.check.outputs.cfg }}-${{ steps.up.outputs.up }}
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:head-${{ steps.check.outputs.head }}-rocm
          cache-from: type=gha,scope=rocm
          cache-to: type=gha,mode=max,scope=rocm

      - name: Summary
        if: steps.build.outputs.digest != ''
        run: |
          {
            echo "### buun-llama-cpp rocm (gfx1100;gfx1150;gfx1151) image built"
            echo ""
            echo "- pull: \`docker pull ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-rocm\`"
            echo "- upstream: \`${{ steps.up.outputs.up }}\` / fork head: \`${{ steps.check.outputs.head }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
