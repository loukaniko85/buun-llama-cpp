name: Build vulkan server image

on:
  workflow_run:
    workflows: ["Sync upstream and build server image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if an image for the current upstream commit already exists
        type: boolean
        default: false

concurrency:
  group: vulkan-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  vulkan-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve upstream commit
        id: up
        run: |
          git remote add upstream https://github.com/spiritbuun/buun-llama-cpp.git 2>/dev/null || true
          git fetch --no-tags upstream master
          UP=$(git rev-parse --short=12 upstream/master)
          echo "up=$UP" >> "$GITHUB_OUTPUT"
          echo "upstream head: $UP"

      - name: Fix build context (.dockerignore)
        run: |
          if grep -qxF 'models/*' .dockerignore 2>/dev/null; then
            grep -vxF 'models/*' .dockerignore > .dockerignore.tmp
            mv .dockerignore.tmp .dockerignore
            echo "removed 'models/*' exclusion - chat templates must reach the build context"
          else
            echo "no 'models/*' exclusion present"
          fi
          cat .dockerignore

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/share/miniconda
          df -h / | tail -1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: check
        run: |
          HEAD12=$(git rev-parse --short=12 HEAD)
          echo "head=$HEAD12" >> "$GITHUB_OUTPUT"
          # Stamp = build config (Dockerfile + this workflow) + upstream commit.
          CFG=$(cat .devops/vulkan.Dockerfile .github/workflows/vulkan-build.yml | sha1sum | cut -c1-8)
          echo "cfg=$CFG" >> "$GITHUB_OUTPUT"
          exists=false
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:vulkan-${CFG}-${{ steps.up.outputs.up }}" >/dev/null 2>&1; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "stamp vulkan-${CFG}-${{ steps.up.outputs.up }} already built: $exists"

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/setup-buildx-action@v4

      - name: Build and push vulkan server image
        id: build
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/vulkan.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_SOURCE=https://github.com/loukaniko85/buun-llama-cpp
            IMAGE_URL=https://github.com/loukaniko85/buun-llama-cpp
          tags: |
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-vulkan
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:vulkan-${{ steps.check.outputs.cfg }}-${{ steps.up.outputs.up }}
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:head-${{ steps.check.outputs.head }}-vulkan
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan

      - name: Summary
        if: steps.build.outputs.digest != ''
        run: |
          {
            echo "### buun-llama-cpp vulkan server image built"
            echo ""
            echo "- pull: \`docker pull ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-vulkan\`"
            echo "- upstream: \`${{ steps.up.outputs.up }}\` / fork head: \`${{ steps.check.outputs.head }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
