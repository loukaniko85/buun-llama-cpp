name: Build Dory server image (fork + PR 30306)

# Dory = NVIDIA Nemotron Labs Dory1.0-4B (arch "dory"), ported from
# ggml-org/llama.cpp PR #30306 onto this fork's master.
#
# This branch is intentionally separate: it never merges into master and it
# never pushes the vanilla tags. The build here only publishes dory tags, so
# `:server-cuda` / `:latest` keep tracking vanilla upstream.
#
# Trigger: push to `dory`, or Actions -> this workflow -> "Run workflow" with
# ref = dory. (workflow_dispatch requires the file to exist on the default
# branch; the path is the same on master, so dispatch-by-ref works.)

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if an image for this dory commit already exists
        type: boolean
        default: false
  push:
    branches: [dory]

concurrency:
  group: dory-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-dory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fork (dory branch)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Sanity check — Dory arch present in source
        run: |
          grep -q '"dory"' src/llama-arch.cpp || { echo "LLM_ARCH_DORY missing"; exit 1; }
          grep -q 'llama_model_dory' src/models/models.h || { echo "llama_model_dory missing"; exit 1; }
          echo "dory arch wiring present"

      - name: Fix build context (.dockerignore)
        run: |
          if grep -qxF 'models/*' .dockerignore 2>/dev/null; then
            grep -vxF 'models/*' .dockerignore > .dockerignore.tmp
            mv .dockerignore.tmp .dockerignore
            echo "removed 'models/*' exclusion - chat templates must reach the build context"
          else
            echo "no 'models/*' exclusion present"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: check
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          exists=false
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:dory-$SHA" >/dev/null 2>&1; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "dory image for $SHA already built: $exists"

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/setup-buildx-action@v4

      - name: Build and push Dory server image
        id: build
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          # Same two cards as the vanilla image: 3070 (sm_86) + 5060 Ti (sm_120a).
          build-args: |
            CUDA_VERSION=12.8.1
            CUDA_DOCKER_ARCH=86-real;120a-real
            IMAGE_SOURCE=https://github.com/loukaniko85/buun-llama-cpp/tree/dory
            IMAGE_URL=https://github.com/loukaniko85/buun-llama-cpp/tree/dory
          tags: |
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:dory
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:server-cuda-dory
            ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:dory-${{ steps.check.outputs.sha }}
          # Separate cache scope so a dory build never evicts the vanilla cache.
          cache-from: type=gha,scope=dory
          cache-to: type=gha,mode=max,scope=dory

      - name: Summary
        if: steps.build.outputs.digest != ''
        run: |
          {
            echo "### Dory server image built"
            echo ""
            echo "- pull: \`docker pull ghcr.io/${{ github.repository_owner }}/buun-llama-cpp:dory\`"
            echo "- commit: \`${{ steps.check.outputs.sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Run: \`-m /models/<dory.gguf> --host 0.0.0.0 --port 8080 -ngl 999 -c 16384 -np 2 --jinja --flash-attn on\`"
            echo "Optional: \`--override-kv \"dory.num_loops=int:2\"\` (default 2), \`--reasoning off\` if it over-thinks."
          } >> "$GITHUB_STEP_SUMMARY"
